<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ps-indigo-grad-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="ps-cyan-grad-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="ps-glow-h" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Simbolo -->
  <g transform="translate(15, 10)">
    <polygon points="40,4 72,22 72,58 40,76 8,58 8,22" fill="#0B0F19" stroke="#1E293B" stroke-width="2" />
    <path d="M20,30 L40,18 L60,30 L40,42 Z" fill="#1E293B" stroke="url(#ps-indigo-grad-h)" stroke-width="1.8" opacity="0.7" />
    <path d="M20,40 L40,28 L60,40 L40,52 Z" fill="#141C2E" stroke="url(#ps-cyan-grad-h)" stroke-width="2" filter="url(#ps-glow-h)" />
    <path d="M20,50 L40,38 L60,50 L40,62 Z" fill="#0F172A" stroke="#10B981" stroke-width="1.8" />
    <polygon points="40,34 45,39 40,44 35,39" fill="#00F0FF" />
  </g>

  <!-- Typography -->
  <text x="115" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
    Portfolio<tspan fill="#6366F1">Suite</tspan>
  </text>
  
  <text x="117" y="74" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" fill="#00F0FF" letter-spacing="2">
    REACT 19 • PRISMA • EXPRESS • DOCKER VPS
  </text>
</svg>
