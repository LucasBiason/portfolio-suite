<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ps-indigo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="ps-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="ps-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Hexagon -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" fill="#0B0F19" stroke="#1E293B" stroke-width="2.5" />

  <!-- Layered Showcase Isometric Plates -->
  <path d="M26,38 L50,24 L74,38 L50,52 Z" fill="#1E293B" stroke="url(#ps-indigo-grad)" stroke-width="2" opacity="0.7" />
  <path d="M26,50 L50,36 L74,50 L50,64 Z" fill="#141C2E" stroke="url(#ps-cyan-grad)" stroke-width="2.2" filter="url(#ps-glow)" />
  <path d="M26,62 L50,48 L74,62 L50,76 Z" fill="#0F172A" stroke="#10B981" stroke-width="2" />

  <!-- Center Diamond Spark / Cursor -->
  <polygon points="50,42 56,48 50,54 44,48" fill="#00F0FF" filter="url(#ps-glow)" />

  <!-- Micro Orbit Nodes -->
  <circle cx="50" cy="24" r="3" fill="#818CF8" />
  <circle cx="74" cy="50" r="3" fill="#00F0FF" />
  <circle cx="26" cy="50" r="3" fill="#6366F1" />
  <circle cx="50" cy="76" r="3" fill="#10B981" />
</svg>
